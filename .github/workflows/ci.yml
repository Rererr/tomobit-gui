name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ドキュメント検査は Go にも Wails にも依存しないので、macOS ランナーを
  # 待たせずに済むよう test とは別ジョブにする。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cross-repoリンク（本体のADRを指すURL）の参照先を見るため、隣の
      # リポジトリも並べる。checkout は workspace の外へ置けないので、
      # $ADR_LINK_SIBLINGS で探す場所をここへ向ける。
      - uses: actions/checkout@v4
        with:
          repository: Rererr/tomobit
          path: _siblings/tomobit

      # ADRの `関連:` ブロックは参照先の表題の記憶から書かれがちで、
      # ファイル名とずれても人間の目には読めてしまう。機械で見る。
      - name: ADRリンクの参照先
        run: make docs-check
        env:
          ADR_LINK_SIBLINGS: _siblings

  # GUIの前提は macOS (README「セットアップ」)。Wails は Linux では webkit2gtk を
  # 要求するため、対応を宣言していないプラットフォームを CI で偽装しない。
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: frontend install
        working-directory: frontend
        run: npm ci

      - name: frontend test
        working-directory: frontend
        run: npm test

      # Go側より先に。main.go の `go:embed all:frontend/dist` は dist が無いと
      # コンパイルに失敗し、gofmt以外のGoステップが全部倒れる(実測: CI初回)。
      # frontend/dist はビルド生成物でgitignore対象なので、CIでは必ずここで作る。
      # `npm run build` は `tsc && vite build` — 型検査もこの中で走る。
      - name: frontend build
        working-directory: frontend
        run: npm run build

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 実Providerを叩く E2E は TOMOBIT_GUI_E2E=1 でのみ走る。CIでは立てない。
      - name: go test
        run: go test ./...
